
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docentes de Matemática | Nexus Académico</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #172033;
}

header {
    background: white;
    padding: 25px 7%;
    border-bottom: 1px solid #e5e7eb;
}

header a {
    color: #344b80;
    text-decoration: none;
    font-size: 14px;
}

header h1 {
    margin-top: 15px;
    font-size: 25px;
    color: #172b4d;
}

header h1 span {
    color: #4057a5;
}

header p {
    color: #697386;
    margin-top: 6px;
}

main {
    max-width: 1200px;
    width: 92%;
    margin: 35px auto;
}

.encabezado {
    text-align: center;
    margin-bottom: 25px;
}

.encabezado h2 {
    color: #243b68;
    margin-bottom: 9px;
}

.encabezado p {
    color: #697386;
}

#buscar {
    display: block;
    width: 100%;
    max-width: 550px;
    margin: 25px auto 30px;
    padding: 13px 16px;
    border: 1px solid #d9deea;
    border-radius: 10px;
    font-size: 15px;
    outline-color: #5269c5;
}

.lista-docentes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 20px;
}

.tarjeta {
    background: white;
    border: 1px solid #e1e5ed;
    border-radius: 19px;
    padding: 21px 17px;
    text-align: center;
    box-shadow: 0 4px 13px rgba(0,0,0,0.06);
    min-height: 300px;
}

.parte-superior {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    margin-bottom: 17px;
}

.iniciales {
    width: 49px;
    height: 49px;
    min-width: 49px;
    border-radius: 50%;
    background: #e1e7ff;
    color: #303eaa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: bold;
}

.tarjeta h3 {
    font-size: 16px;
    line-height: 1.5;
    color: #101827;
}

.tarjeta p {
    font-size: 14px;
    line-height: 1.5;
    margin: 10px 0;
}

.tarjeta strong {
    color: #25334e;
}

.etiqueta {
    display: inline-block;
    margin-top: 8px;
    padding: 7px 12px;
    background: #fff5ec;
    color: #b33a20;
    border-radius: 9px;
    font-size: 11px;
}

.etiqueta.pendiente {
    background: #f0f2f6;
    color: #687386;
}

.sin-resultados {
    display: none;
    text-align: center;
    padding: 25px;
    color: #777;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    padding: 22px;
    margin-top: 40px;
    background: #172b4d;
    color: white;
    font-size: 13px;
}

@media(max-width: 600px) {
    main {
        width: 90%;
    }

    .lista-docentes {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <a href="ingenieros.html">← Volver a materias</a>
    <h1>NEXUS <span>ACADÉMICO</span></h1>
    <p>Directorio académico</p>
</header>

<main>

    <section class="encabezado">
        <h2>Departamento de Matemática (MAT)</h2>
        <p>Información académica de los 35 docentes</p>
    </section>

    <input
        type="text"
        id="buscar"
        placeholder="Buscar docente por nombre..."
    >

    <p id="contador" style="text-align:center; color:#697386; margin:-15px auto 25px;">
        35 docentes registrados
    </p>

    <section class="lista-docentes" id="listaDocentes"></section>

    <p class="sin-resultados" id="sinResultados">
        No se encontraron docentes.
    </p>

</main>

<footer>
    NEXUS ACADÉMICO · Recursos universitarios para estudiantes
</footer>

function obtenerIniciales(nombre) {
    const palabras = nombre.split(" ");
    return palabras[0][0] + palabras[1][0];
}

function mostrarDocentes(lista) {
    const contenedor = document.getElementById("listaDocentes");
    const sinResultados = document.getElementById("sinResultados");
    const contador = document.getElementById("contador");

    contador.textContent = lista.length +
        (lista.length === 1 ? " docente encontrado" : " docentes encontrados");

    contenedor.innerHTML = "";

    lista.forEach(docente => {
        const iniciales = obtenerIniciales(docente.nombre);

        const etiqueta = docente.demo
            ? '<span class="etiqueta">Datos de demostración</span>'
            : '<span class="etiqueta pendiente">Información pendiente</span>';

        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta";

        tarjeta.innerHTML = `
            <div class="parte-superior">
                <div class="iniciales">${iniciales}</div>
                <h3>${docente.nombre}</h3>
            </div>

            <p><strong>Materia:</strong> Matemática.</p>
            <p><strong>Forma de enseñanza:</strong> Información por confirmar.</p>
            <p><strong>Prácticas:</strong> Pendientes de información.</p>
            <p><strong>Evaluaciones:</strong> Por confirmar.</p>
            <p><strong>Ponderaciones:</strong> ${docente.ponderacion}.</p>

            ${etiqueta}
        `;

        contenedor.appendChild(tarjeta);
    });

    sinResultados.style.display =
        lista.length === 0 ? "block" : "none";
}

function normalizarTexto(texto) {
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
}

document.getElementById("buscar").addEventListener("input", function() {
    const texto = normalizarTexto(this.value);

    const filtrados = docentes.filter(docente =>
        normalizarTexto(docente.nombre).includes(texto)
    );

    mostrarDocentes(filtrados);
});

mostrarDocentes(docentes);
</script>
