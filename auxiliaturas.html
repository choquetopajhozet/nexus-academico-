<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auxiliaturas | Nexus Académico</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6fa;
            color: #17243b;
        }

        header {
            background: #0b1730;
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid #d4af37;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 2px;
        }

        header p {
            color: #d9e1ef;
            margin-bottom: 0;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .volver {
            display: inline-block;
            background: #0b1730;
            color: white;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .volver:hover {
            background: #d4af37;
            color: #0b1730;
        }

        .presentacion {
            text-align: center;
            margin-bottom: 35px;
        }

        .presentacion h2 {
            color: #0b1730;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .presentacion p {
            color: #5c6678;
            line-height: 1.6;
        }

        .departamentos {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        button {
            font-family: inherit;
        }

        .boton-departamento {
            background: #10264a;
            color: white;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 22px 12px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .boton-departamento span {
            display: block;
            font-size: 13px;
            font-weight: normal;
            margin-top: 7px;
            color: #d9e1ef;
        }

        .boton-departamento:hover,
        .boton-departamento.activo {
            background: #d4af37;
            color: #0b1730;
            transform: translateY(-3px);
        }

        .boton-departamento:hover span,
        .boton-departamento.activo span {
            color: #0b1730;
        }

        .departamento {
            display: none;
            background: white;
            padding: 25px;
            margin-bottom: 28px;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(11, 23, 48, 0.08);
            border-top: 4px solid #d4af37;
        }

        .departamento.visible {
            display: block;
        }

        .departamento h2 {
            color: #0b1730;
            font-size: 21px;
            margin: 0 0 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e3e7ef;
        }

        .materias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
        }

        .materias button {
            background: #10264a;
            color: white;
            border: 1px solid #d4af37;
            border-radius: 9px;
            padding: 16px 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .materias button:hover {
            background: #d4af37;
            color: #0b1730;
            transform: translateY(-3px);
        }

        footer {
            background: #0b1730;
            color: #d9e1ef;
            text-align: center;
            padding: 22px 15px;
            margin-top: 45px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            .departamentos {
                grid-template-columns: 1fr;
            }

            .departamento {
                padding: 18px;
            }

            .materias {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>NEXUS ACADÉMICO</h1>
    <p>Tu espacio de apoyo universitario</p>
</header>

<main>
    <a href="./index.html" class="volver">← Volver al inicio</a>

    <section class="presentacion">
        <h2>Auxiliaturas</h2>
        <p>
            Selecciona un departamento para consultar
            las materias y sus recursos académicos.
        </p>
    </section>

    <div class="departamentos">
        <button class="boton-departamento"
                onclick="mostrarDepartamento('mat', this)">
            MAT
            <span>Matemática</span>
        </button>

        <button class="boton-departamento"
                onclick="mostrarDepartamento('fis', this)">
            FIS
            <span>Física</span>
        </button>

        <button class="boton-departamento"
                onclick="mostrarDepartamento('qmc', this)">
            QMC
            <span>Química</span>
        </button>
    </div>

    <!-- MATEMÁTICA -->
    <section id="mat" class="departamento">
        <h2>Auxiliaturas de Matemática</h2>

        <div class="materias">
            <button onclick="mostrarAviso('MAT 1100')">MAT 1100</button>
            <button onclick="mostrarAviso('MAT 1101')">MAT 1101</button>
            <button onclick="mostrarAviso('MAT 1102')">MAT 1102</button>
            <button onclick="mostrarAviso('MAT 1103')">MAT 1103</button>
            <button onclick="mostrarAviso('MAT 1105')">MAT 1105</button>
            <button onclick="mostrarAviso('MAT 1207')">MAT 1207</button>
            <button onclick="mostrarAviso('MAT 1135')">MAT 1135</button>
            <button onclick="mostrarAviso('MAT 1437')">MAT 1437</button>
        </div>
    </section>

    <!-- FÍSICA -->
    <section id="fis" class="departamento">
        <h2>Auxiliaturas de Física</h2>

        <div class="materias">
            <button onclick="mostrarAviso('FIS 1100')">FIS 1100</button>
            <button onclick="mostrarAviso('FIS 1102')">FIS 1102</button>
            <button onclick="mostrarAviso('FIS 1200')">FIS 1200</button>
        </div>
    </section>

    <!-- QUÍMICA -->
    <section id="qmc" class="departamento">
        <h2>Auxiliaturas de Química</h2>

        <div class="materias">
            <button onclick="mostrarAviso('QMC 1100')">QMC 1100</button>
        </div>
    </section>

</main>

<footer>
    <p>© 2026 Nexus Académico | Proyecto universitario</p>
</footer>

<script>
    function mostrarDepartamento(id, boton) {
        document.querySelectorAll('.departamento').forEach(function(seccion) {
            seccion.classList.remove('visible');
        });

        document.querySelectorAll('.boton-departamento').forEach(function(b) {
            b.classList.remove('activo');
        });

        document.getElementById(id).classList.add('visible');
        boton.classList.add('activo');
    }

    function mostrarAviso(materia) {
        alert(
            'Los recursos de la auxiliatura de ' +
            materia +
            ' estarán disponibles próximamente.'
        );
    }
</script>

</body>
</html>
